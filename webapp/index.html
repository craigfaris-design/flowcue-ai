<html lang="en">

    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <title>FlowCue AI</title>
    <meta name="description" content="FlowCue AI — the AI speech companion that never loses your place." />
    <!-- Poppins: the brand style guide's chosen UI typeface, for all app
         chrome (nav, buttons, headings, panels) -- deliberately does NOT
         apply to the rehearsal reading text, which keeps its original
         system-font stack (see RehearsalStage.css). The offline app-shell
         service worker (public/sw.js) caches all GET requests including
         cross-origin ones, so this degrades gracefully offline after the
         first successful load rather than breaking. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
