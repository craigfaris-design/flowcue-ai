<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#9c4420" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowCue AI</title>
    <meta name="description" content="FlowCue AI — the AI speech companion that never loses your place." />
    <!-- Poppins: the brand style guide's chosen UI typeface, for all app
         chrome (nav, buttons, headings, panels) -- deliberately does NOT
         apply to the rehearsal reading text, which keeps its original
         system-font stack (see RehearsalStage.css). The offline app-shell
         service worker (public/sw.js) caches all GET requests including
         cross-origin ones, so this degrades gracefully offline after the
         first successful load rather than breaking. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Inlined (not in theme.css) so this paints immediately, before the
         external stylesheet has necessarily loaded -- the whole point of a
         launch splash is to never show an unstyled flash first. Mirrors the
         native Android splash screen (see android/twa-manifest.json's
         backgroundColor) but can actually animate, unlike that one: TWA's
         native splash is a single static bitmap with no animation support
         short of ejecting to a custom native Activity, so this in-app
         screen is what carries the "pulsing until the app opens" request
         for virtually the whole visible launch time. -->
    <style>
      #flowcueSplash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: #000;
      }
      #flowcueSplash img {
        width: 220px;
        height: auto;
        animation: flowcueSplashPulse 1.6s ease-in-out infinite;
      }
      #flowcueSplash__wordmark {
        font-family: "Poppins", -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0.02em;
        color: #fff;
      }
      #flowcueSplash__wordmark span {
        background: linear-gradient(90deg, #4f6bff, #e347c9);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      @keyframes flowcueSplashPulse {
        0%, 100% { opacity: 0.72; transform: scale(0.94); }
        50% { opacity: 1; transform: scale(1.06); }
      }
      @media (prefers-reduced-motion: reduce) {
        #flowcueSplash img { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="flowcueSplash">
      <img src="/logo-icon.png" alt="" />
      <div id="flowcueSplash__wordmark">FlowCue<span> AI</span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
